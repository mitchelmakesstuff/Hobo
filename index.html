<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hobo — Drift Social</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/themes.css" id="theme-sheet">
</head>
<body class="theme-night">
<canvas id="field"></canvas>

<header id="topbar">
  <div id="logo">HOBO<span class="dot">.</span></div>
  <nav>
    <button id="btn-theme" title="Change theme" aria-label="Change theme">◐</button>
    <button id="btn-pouch" title="Open pouch" aria-label="Open pouch">🎒 <span id="pouch-count">0</span></button>
  </nav>
</header>

<button id="btn-drop" aria-label="Drop a flare">✳ Drop a flare</button>

<div id="hint">tap a drifting flare to catch it</div>

<!-- Drop modal -->
<div class="modal" id="modal-drop" hidden>
  <div class="sheet">
    <div class="tabs">
      <button data-tab="text" class="tab active">Text</button>
      <button data-tab="doodle" class="tab">Doodle</button>
    </div>
    <div id="drop-text">
      <textarea id="flare-text" maxlength="140" placeholder="what's drifting through your mind?"></textarea>
      <div class="moods">
        <button class="mood" data-mood="#ff6b8b" style="background:#ff6b8b" aria-label="mood pink"></button>
        <button class="mood" data-mood="#ffd166" style="background:#ffd166" aria-label="mood yellow"></button>
        <button class="mood" data-mood="#7bdff2" style="background:#7bdff2" aria-label="mood blue"></button>
        <button class="mood" data-mood="#b8f2a9" style="background:#b8f2a9" aria-label="mood green"></button>
        <button class="mood" data-mood="#d5b3ff" style="background:#d5b3ff" aria-label="mood purple"></button>
      </div>
    </div>
    <div id="drop-doodle" hidden>
      <canvas id="doodle-pad" width="300" height="300"></canvas>
      <button id="doodle-clear" class="ghost-btn">clear</button>
    </div>
    <div class="sheet-actions">
      <button id="drop-cancel" class="ghost-btn">cancel</button>
      <button id="drop-send">Release ✳</button>
    </div>
  </div>
</div>

<!-- Catch modal -->
<div class="modal" id="modal-catch" hidden>
  <div class="sheet">
    <div id="catch-body"></div>
    <textarea id="echo-text" maxlength="140" placeholder="send an echo back..."></textarea>
    <div class="sheet-actions">
      <button id="catch-close" class="ghost-btn">let it drift</button>
      <button id="catch-keep">Keep in pouch 🎒</button>
    </div>
    <div class="sheet-actions">
      <button id="echo-send" class="full">Echo ↩</button>
    </div>
  </div>
</div>

<!-- Pouch modal -->
<div class="modal" id="modal-pouch" hidden>
  <div class="sheet">
    <h2>Your pouch</h2>
    <div id="pouch-list"></div>
    <div class="sheet-actions">
      <button id="pouch-close" class="full">close</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/drift-engine.js"></script>
<script src="js/flares.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
